version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: dt_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: dt_backend
    environment:
      - DATABASE_URL=postgres://dt:dentaltourism@db:5432/dt?sslmode=disable
      - PORT=8080
    ports:
      - "9090:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    build: ./db
    container_name: dt_db
    environment:
      POSTGRES_USER: dt
      POSTGRES_PASSWORD: dentaltourism
      POSTGRES_DB: dt
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dt -d dt"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dt_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8888:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
  pgadmin_data:
