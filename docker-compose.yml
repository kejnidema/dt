services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    container_name: dt_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://dt:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dt?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dt
      POSTGRES_DB: dt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - leads_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dt -d dt"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  leads_data:
